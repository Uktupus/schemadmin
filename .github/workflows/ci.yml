name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "stable"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: schemadmin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SCHEMADMIN_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SCHEMADMIN_MYSQL_DSN: root@tcp(127.0.0.1:3306)/schemadmin?parseTime=true&multiStatements=true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"

      - name: Core module has no dependencies
        run: test "$(go list -m all | wc -l)" -eq 1

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Unit tests
        run: go vet ./... && go test -race ./...

      - name: Integration tests (SQLite, PostgreSQL, MySQL)
        working-directory: integration
        run: go vet ./... && go test -race ./...

      - name: Example builds
        working-directory: example
        run: go vet ./... && go build ./...
